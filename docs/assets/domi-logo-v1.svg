<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">domi logo concept</title>
  <desc id="desc">A bold single kidney-bean mark for domi, paired with a lowercase wordmark.</desc>

  <defs>
    <linearGradient id="bean" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#E56C5B"/>
      <stop offset="0.55" stop-color="#C9444C"/>
      <stop offset="1" stop-color="#8E293B"/>
    </linearGradient>
  </defs>

  <!-- Icon: one asymmetrical kidney bean, tilted forward like a new idea in motion. -->
  <g transform="translate(55 55)">
    <path
      d="M218 22 C178 8 126 25 88 62 C38 111 26 190 46 278 C67 371 137 455 225 468 C296 478 354 433 365 362 C378 281 339 198 296 138 C270 102 245 79 219 73 C199 69 196 54 218 22 Z"
      fill="url(#bean)"
    />
    <path
      d="M219 73 C246 79 270 103 295 138 C326 182 349 235 354 286 C319 254 286 230 254 220 C216 207 179 209 145 222 C167 175 188 123 219 73 Z"
      fill="#F79B83"
      opacity="0.48"
    />
    <path
      d="M217 24 C206 43 207 61 220 72"
      fill="none"
      stroke="#7C2538"
      stroke-width="10"
      stroke-linecap="round"
    />
  </g>

  <!-- Wordmark -->
  <g transform="translate(520 0)">
    <text x="0" y="345" fill="#12212B" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="190" font-weight="760" letter-spacing="-11">domi</text>
    <rect x="10" y="392" width="298" height="12" rx="6" fill="#D55255"/>
  </g>
</svg>
