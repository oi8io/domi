<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上下文降级链演示</title>
<style>
  :root{--bg:#0D141B;--card:#111A23;--line:#2A3B4D;--tx:#E8EEF4;--mut:#8FA1B2;
        --cy:#22D3EE;--gr:#4ADE80;--vi:#A78BFA;--am:#FBBF24;--rd:#F87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
       padding:24px 16px 48px;line-height:1.6}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;margin-bottom:6px}
  .note{color:var(--mut);font-size:13px;margin-bottom:4px}
  .warn{color:var(--am);font-size:13px;margin-bottom:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
  .field{flex:1;min-width:200px}
  .field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:110px;padding:11px 8px;font-size:14px;border-radius:8px;border:1px solid var(--line);
              background:var(--card);color:var(--tx);cursor:pointer;font-family:inherit}
  .seg button.on{background:#0F1E26;border-color:var(--cy);color:var(--cy)}
  input[type=range]{width:100%;accent-color:var(--cy)}
  .val{color:var(--cy);font-weight:700}
  .sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer;user-select:none;padding:6px 0}
  .sw input{width:18px;height:18px;accent-color:var(--am)}
  .btn{width:100%;padding:14px;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;font-family:inherit}
  .btn.go{background:var(--cy);color:#04121A}
  .btn.go:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}
  .btn.again{background:var(--card);color:var(--cy);border:1px solid var(--cy);margin-top:10px}
  .meter{height:14px;background:#0A1017;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:6px}
  .meter i{display:block;height:100%;transition:width .35s ease,background .35s ease}
  .lvl{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;margin-left:8px}
  .lvl.ok{background:#052E16;color:var(--gr)}
  .lvl.mask{background:#1A1A10;color:var(--am)}
  .lvl.compact{background:#17142A;color:var(--vi)}
  .lvl.hard{background:#2A0A0A;color:var(--rd)}
  .step{display:none;border-left:3px solid var(--line);padding:4px 0 4px 14px;margin:10px 0}
  .step.show{display:block}
  .step .t{font-size:14px;font-weight:700}
  .step .d{font-size:13px;color:var(--mut)}
  .step.ev{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .evt{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:12px;background:#0A1017;
       border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0;color:#9BE8F5;word-break:break-all}
  .evt.ok{color:#9BE8F5}
  .evt.warn{color:#FDE68A}
  .evt.bad{color:#FCA5A5}
  .out{margin-top:12px;font-size:14px}
  .out b{color:var(--gr)}
  .out b.stop{color:var(--rd)}
  .foot{margin-top:24px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>上下文降级链演示</h1>
  <p class="note">模拟：发请求前，domi 按占用逐级降——遮蔽 → 压缩 → 硬顶。选条件，点「下一步」。</p>
  <p class="warn">这是演示，不连接 domi。事件名与阈值是真实的，数字是模拟的。</p>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label>策略档位（context.strategy）</label>
        <div class="seg" id="strat">
          <button data-v="balanced" class="on">均衡（遮蔽 60%）</button>
          <button data-v="economical">节省（遮蔽 45%）</button>
        </div>
      </div>
      <div class="field">
        <label>初始占用：<span class="val" id="useVal">65%</span></label>
        <input type="range" id="use" min="55" max="95" step="5" value="65">
      </div>
      <div class="field">
        <label>遮蔽结果</label>
        <label class="sw"><input type="checkbox" id="failMask"> 遮蔽腾不出（freed=0）</label>
      </div>
      <div class="field">
        <label>压缩结果</label>
        <label class="sw"><input type="checkbox" id="failCompact"> 压缩也腾不出（freed=0）</label>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label>当前占用</label>
        <div class="meter"><i id="bar" style="width:65%;background:var(--am)"></i></div>
      </div>
      <div style="min-width:180px">
        <span id="pct" style="font-size:20px;font-weight:700">65%</span>
        <span class="lvl mask" id="lvl">mask</span>
      </div>
    </div>
    <div id="steps" style="margin-top:8px"></div>
  </div>

  <div class="panel">
    <div class="out" id="out">点「下一步」开始。</div>
  </div>

  <button class="btn go" id="next">下一步</button>
  <button class="btn again" id="again" style="display:none">重新演示</button>

  <p class="foot">阈值：遮蔽 ≥60%（节省 45%）、压缩 ≥80%、硬顶 ≥92%（任何策略不降）。每级动作后重估；动作失败不阻断，由硬顶收口。</p>
</div>

<script>
(function(){
  "use strict";
  var state = {phase:0, level:'ok', used:0, strat:'balanced', failMask:false, failCompact:false};
  var EVTS = [];

  var $ = function(id){ return document.getElementById(id); };
  var steps = $('steps'), out = $('out'), bar = $('bar'), pct = $('pct'), lvl = $('lvl');
  var nextBtn = $('next'), againBtn = $('again');

  function setLevel(level){
    state.level = level;
    lvl.className = 'lvl ' + level;
    lvl.textContent = {ok:'正常 ok', mask:'遮蔽 mask', compact:'压缩 compact', hard:'硬顶 hard'}[level];
    var color = {ok:'var(--gr)', mask:'var(--am)', compact:'var(--vi)', hard:'var(--rd)'}[level];
    bar.style.background = color;
  }
  function render(){
    pct.textContent = Math.round(state.used) + '%';
    bar.style.width = Math.max(0, Math.min(100, state.used)) + '%';
    setLevel(state.level);
  }
  function evaluate(used){
    var maskAt = state.strat === 'economical' ? 45 : 60;
    if (used >= 92) return 'hard';
    if (used >= 80) return 'compact';
    if (used >= maskAt) return 'mask';
    return 'ok';
  }
  function addStep(cls, title, detail){
    var d = document.createElement('div');
    d.className = 'step show ev ' + (cls||'');
    d.innerHTML = '<div class="t">' + title + '</div><div class="d">' + detail + '</div>';
    steps.appendChild(d);
  }
  function addEvt(cls, text){
    var e = document.createElement('div');
    e.className = 'evt ' + (cls||'');
    e.textContent = text;
    steps.appendChild(e);
    EVTS.push(text);
  }

  function reset(){
    state.phase = 0;
    EVTS = [];
    steps.innerHTML = '';
    out.innerHTML = '点「下一步」开始。';
    nextBtn.style.display = '';
    againBtn.style.display = 'none';
    nextBtn.textContent = '下一步';
    nextBtn.disabled = false;
    state.used = parseInt($('use').value, 10);
    state.failMask = $('failMask').checked;
    state.failCompact = $('failCompact').checked;
    render();
  }
  function resetIfStarted(){
    if (state.phase > 0) reset();
  }

  function step(){
    var u = state.used, l = evaluate(u);
    state.phase += 1;
    switch(state.phase){
      case 1:
        addStep('', '① 估占用', 'evaluate(' + Math.round(u) + '%, effective) → 档位：' + l);
        setLevel(l);
        break;
      case 2:
        if (l === 'ok'){ finish('proceed'); return; }
        addStep('', '② 到遮蔽档（' + (state.strat==='economical'?'≥45%':'≥60%') + '）', '遮蔽一批冷区（最近 10 步、32k token 之外的工具输出）');
        if (state.failMask){
          addEvt('warn', 'ctx.mask{seqs:[…], freedTokens:0}  ← 腾不出，视为未生效');
          addStep('', '重估', 'freed=0，不减占用。继续往下');
          state.used = u; render();
        } else {
          var freed = 20;
          addEvt('ok', 'ctx.mask{seqs:[2..6], reason:"cold", freedTokens:~8000}');
          addStep('', '重估', '腾出 ' + freed + '%，占用 ' + Math.round(u) + '% → ' + (u-freed) + '%');
          state.used = Math.max(0, u - freed); render();
        }
        break;
      case 3:
        u = state.used; l = evaluate(u);
        if (l !== 'compact' && l !== 'hard'){ finish('proceed'); return; }
        addStep('', '③ 到压缩档（≥80%）', '压缩中间历史：保边（最近 8 步 / 24k token），覆盖区间换成结构化摘要');
        addEvt('ok', 'ctx.compact{fromSeq:3, toSeq:8, summary:{goal, keyDecisions, …}}');
        var freed2 = state.failCompact ? 0 : 35;
        if (state.failCompact){
          addEvt('warn', '压缩也腾不出：freed=0，不减占用');
          addStep('', '重估', '占用仍是 ' + Math.round(u) + '%。继续往下');
        } else {
          addStep('', '重估', '腾出 ' + freed2 + '%，占用 ' + Math.round(u) + '% → ' + (u-freed2) + '%');
        }
        state.used = Math.max(0, u - freed2); render();
        break;
      case 4:
        u = state.used; l = evaluate(u);
        if (l !== 'hard'){ finish('proceed'); return; }
        addStep('', '④ 仍到硬顶（≥92%）', '本轮停。落 error 事件并给出出路');
        addEvt('bad', 'error{scope:"context", recoverable:true, message:"上下文已到硬顶…"}');
        finish('stop'); return;
      default:
        finish('proceed');
    }
  }

  function finish(kind){
    if (kind === 'stop'){
      out.innerHTML = '<b class="stop">本轮停。</b> 已落 error{scope:"context", recoverable:true}。三条出路：<br>· 在对话里再压缩一次（/compact）<br>· 开一个新会话，把摘要带过去<br>· 换一个窗口更大的模型';
    } else {
      out.innerHTML = '<b>proceed：继续发请求。</b> 降级动作把占用打下来了，模型照常生成。';
    }
    nextBtn.disabled = true;
    againBtn.style.display = '';
    nextBtn.textContent = '完成';
    addStep('', '收场', '这一轮结束。原始事件一条没动，投影变了而已');
  }

  $('next').addEventListener('click', step);
  $('again').addEventListener('click', reset);

  var segs = document.querySelectorAll('#strat button');
  for (var i=0;i<segs.length;i++){
    segs[i].addEventListener('click', function(){
      for (var j=0;j<segs.length;j++) segs[j].className = '';
      this.className = 'on';
      state.strat = this.getAttribute('data-v');
      resetIfStarted();
    });
  }
  $('use').addEventListener('input', function(){
    $('useVal').textContent = this.value + '%';
    state.used = parseInt(this.value, 10);
    resetIfStarted();
    if (state.phase === 0) render();
  });
  $('failMask').addEventListener('change', function(){ state.failMask = this.checked; resetIfStarted(); });
  $('failCompact').addEventListener('change', function(){ state.failCompact = this.checked; resetIfStarted(); });

  reset();
})();
</script>
</body>
</html>
