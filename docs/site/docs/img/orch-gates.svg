<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">模型每次动手前要过的三道闸</title>
<desc id="d">计划闸、用量上限、权限依次检查；任何一道拦下，工具都不执行。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .h{font-size:15px;font-weight:700}
  .s{font-size:12px;fill:#8FA1B2}
  .t{font-size:12.5px}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11.5px;fill:#8FA1B2}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.4;fill:none}
</style>
<rect width="880" height="380" rx="14" fill="#0D141B"/>
<rect class="box" x="16" y="24" width="110" height="64" rx="10"/>
<text class="h" x="71" y="52" text-anchor="middle">模型要调用</text>
<text class="h" x="71" y="72" text-anchor="middle">一个工具</text>
<rect x="142" y="24" width="188" height="64" rx="10" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.4"/>
<text class="h" x="236" y="52" text-anchor="middle" style="fill:#22D3EE">① 计划闸</text>
<text class="s" x="236" y="72" text-anchor="middle">这是任务会话的纪律</text>
<rect x="346" y="24" width="188" height="64" rx="10" fill="#1A1A10" stroke="#FBBF24" stroke-width="1.4"/>
<text class="h" x="440" y="52" text-anchor="middle" style="fill:#FBBF24">② 用量上限</text>
<text class="s" x="440" y="72" text-anchor="middle">防止花得太多</text>
<rect x="550" y="24" width="188" height="64" rx="10" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.4"/>
<text class="h" x="644" y="52" text-anchor="middle" style="fill:#4ADE80">③ 权限</text>
<text class="s" x="644" y="72" text-anchor="middle">你写的规则说了算</text>
<rect x="754" y="24" width="110" height="64" rx="10" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.4"/>
<text class="h" x="809" y="52" text-anchor="middle" style="fill:#4ADE80">执行</text>
<text class="s" x="809" y="72" text-anchor="middle">结果交回模型</text>
<path d="M126 56 H140" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M330 56 H344" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M534 56 H548" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M738 56 H752" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="142" y="104" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="148" y="110" width="30" height="16" rx="4" fill="#0F1A14" stroke="#4ADE80" stroke-width="1"/>
<text x="163" y="122.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#4ADE80">放行</text>
<text class="t" x="186" y="122.5">读、搜索、提问、写计划</text>
<rect x="142" y="138" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="148" y="144" width="30" height="16" rx="4" fill="#221316" stroke="#F87171" stroke-width="1"/>
<text x="163" y="156.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#F87171">拦</text>
<text class="t" x="186" y="156.5">任务里还没有计划</text>
<rect x="142" y="172" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="148" y="178" width="30" height="16" rx="4" fill="#221316" stroke="#F87171" stroke-width="1"/>
<text x="163" y="190.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#F87171">拦</text>
<text class="t" x="186" y="190.5">要批准，但还没批准</text>
<rect x="346" y="104" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="352" y="110" width="30" height="16" rx="4" fill="#0F1A14" stroke="#4ADE80" stroke-width="1"/>
<text x="367" y="122.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#4ADE80">放行</text>
<text class="t" x="390" y="122.5">用量低于 80%</text>
<rect x="346" y="138" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="352" y="144" width="30" height="16" rx="4" fill="#111A23" stroke="#8FA1B2" stroke-width="1"/>
<text x="367" y="156.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#8FA1B2">提醒</text>
<text class="t" x="390" y="156.5">到 80%：提醒一次，继续</text>
<rect x="346" y="172" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="352" y="178" width="30" height="16" rx="4" fill="#1A1A10" stroke="#FBBF24" stroke-width="1"/>
<text x="367" y="190.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#FBBF24">问</text>
<text class="t" x="390" y="190.5">到顶：继续 / 加额 / 停</text>
<rect x="550" y="104" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="556" y="110" width="30" height="16" rx="4" fill="#221316" stroke="#F87171" stroke-width="1"/>
<text x="571" y="122.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#F87171">拦</text>
<text class="t" x="594" y="122.5">匹配 deny 规则</text>
<rect x="550" y="138" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="556" y="144" width="30" height="16" rx="4" fill="#0F1A14" stroke="#4ADE80" stroke-width="1"/>
<text x="571" y="156.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#4ADE80">放行</text>
<text class="t" x="594" y="156.5">allow 规则 / 已授权</text>
<rect x="550" y="172" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="556" y="178" width="30" height="16" rx="4" fill="#1A1A10" stroke="#FBBF24" stroke-width="1"/>
<text x="571" y="190.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#FBBF24">问</text>
<text class="t" x="594" y="190.5">ask 规则：等你回答</text>
<rect x="550" y="206" width="188" height="28" rx="7" fill="#111A23" stroke="#1F2E3D"/>
<rect x="556" y="212" width="30" height="16" rx="4" fill="#221316" stroke="#F87171" stroke-width="1"/>
<text x="571" y="224.0" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#F87171">拦</text>
<text class="t" x="594" y="224.5">没有任何规则（默认）</text>
<text class="s" x="146" y="256">被拦下不算失败：这一轮不结束，</text>
<text class="s" x="146" y="274">模型照提示补计划或等批准。</text>
<text class="s" x="350" y="256">token、金额、工具次数分开算。</text>
<text class="s" x="350" y="274">选「停」：这一轮收尾结束。</text>
<text class="s" x="554" y="256">危险能力（写、删、跑命令、联网、</text>
<text class="s" x="554" y="274">MCP、插件）放不放行，</text>
<text class="s" x="554" y="292">还要看确认模式。</text>
<text class="s" x="758" y="256">成功或失败，</text>
<text class="s" x="758" y="274">结果都交回模型，</text>
<text class="s" x="758" y="292">由它决定下一步。</text>
<rect x="16" y="316" width="848" height="48" rx="10" fill="#111A23" stroke="#8FA1B2" stroke-width="1.4"/>
<text class="t" x="32" y="345">顺序固定：计划闸 → 用量 → 权限（之后还有你配置的 hooks）。任何一道拦下，工具都不执行；原因写进记录并告诉模型。</text>
</svg>
