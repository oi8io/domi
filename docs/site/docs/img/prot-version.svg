<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t d">
<title id="t">事件 schema 版本演进</title>
<desc id="d">SCHEMA_VERSION 从 1 演进到 17：地基、记忆与编排、工作台、M12/M13、M14 右侧栏、M15 内核上下文。新增类型或加字段 +1，删类型不行。</desc>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .dot{fill:#22D3EE}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
</style>
<rect width="880" height="430" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">SCHEMA_VERSION：17 版演进，只加不减</text>
<text class="s" x="20" y="56">新增事件类型或加字段 → +1，并追加 fixtures/events/legacy-v{n}.jsonl；不再产生的类型留在联合里读旧会话</text>

<!-- 轴线 -->
<line x1="60" y1="120" x2="840" y2="120" stroke="#2A3B4D" stroke-width="2"/>
<circle cx="140" cy="120" r="6" class="dot"/>
<circle cx="320" cy="120" r="6" class="dot"/>
<circle cx="500" cy="120" r="6" class="dot"/>
<circle cx="640" cy="120" r="6" class="dot"/>
<circle cx="740" cy="120" r="6" class="dot"/>
<circle cx="820" cy="120" r="6" class="dot"/>

<!-- v1-6 -->
<text class="mono" x="118" y="104">v1→v6</text>
<rect class="box" x="70" y="140" width="180" height="86" rx="10"/>
<text class="k" x="84" y="164">地基</text>
<text class="s" x="84" y="186">fs.snapshot · model.switch</text>
<text class="s" x="84" y="202">ctx.cleanup · ctx.compact</text>
<text class="s" x="84" y="218">ctx.ref</text>

<!-- v7-10 -->
<text class="mono" x="298" y="104">v7→v10</text>
<rect class="box" x="238" y="140" width="200" height="86" rx="10"/>
<text class="k" x="252" y="164">记忆与编排</text>
<text class="s" x="252" y="186">memory.write · task.*</text>
<text class="s" x="252" y="202">workspace.trust · hook.run</text>
<text class="s" x="252" y="218">计划 · 工作树 · 预算 · 评审</text>

<!-- v11-13 -->
<text class="mono" x="478" y="104">v11→v13</text>
<rect class="box" x="410" y="140" width="190" height="86" rx="10"/>
<text class="k" x="424" y="164">工作台与确认</text>
<text class="s" x="424" y="186">session.kind · project.assign</text>
<text class="s" x="424" y="202">schedule.fire · model.switch.provider</text>
<text class="s" x="424" y="218">permissions.mode.switch</text>

<!-- v14-15 -->
<text class="mono" x="618" y="104">v14→v15</text>
<rect class="box" x="560" y="140" width="190" height="86" rx="10"/>
<text class="k" x="574" y="164">M12 / M13</text>
<text class="s" x="574" y="186">plan.update · user.note</text>
<text class="s" x="574" y="202">error.stopReason</text>
<text class="s" x="574" y="218">旧 plan 类不再产生</text>

<!-- v16 -->
<text class="mono" x="742" y="104">v16</text>
<rect class="box" x="698" y="140" width="170" height="86" rx="10"/>
<text class="k" x="712" y="164">M14 右侧栏</text>
<text class="s" x="712" y="186">fs.checkpoint</text>
<text class="s" x="712" y="202">ctx.fileref · fs.discard</text>
<text class="s" x="712" y="218">model.request.ctx 分段</text>

<!-- v17 -->
<text class="mono" x="820" y="104">v17</text>
<rect class="box" x="700" y="240" width="180" height="130" rx="10" stroke="#22D3EE" stroke-width="1.5"/>
<text class="k" x="714" y="264" style="fill:#22D3EE">M15 内核上下文</text>
<text class="s" x="714" y="290">ctx.note · ctx.mask</text>
<text class="s" x="714" y="306">ctx.pin · ctx.refresh</text>
<text class="s" x="714" y="322">ctx.prefix.break</text>
<text class="s" x="714" y="338">model.request.fingerprint</text>
<text class="s" x="714" y="358" style="fill:#8FA1B2">当前版本</text>

<!-- 底部规则 -->
<rect x="70" y="290" width="560" height="112" rx="10" fill="#17142A" stroke="#FBBF24" stroke-width="1.2"/>
<text class="k" x="86" y="316" style="fill:#FBBF24">两条硬规则（INV-01）</text>
<text class="s" x="86" y="338">1. 字段只增不改不删；新增字段必须可选且有默认值</text>
<text class="s" x="86" y="356">2. 未知事件类型降级为 UnknownEvent 保留原文，绝不抛错</text>
<text class="s" x="86" y="374">schema 用 z.looseObject：未来新增字段必须留下来</text>
<text class="s" x="86" y="392">迁移只能加列 / 加表 / 加索引（guard:migrations 查）</text>
</svg>
