<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="t d">
<title id="t">提示词怎么拼出来</title>
<desc id="d">左轨事件投影与右轨提示词层在 withPrompt 汇合：notes 追加、system 置顶、稳定 user 块插位；请求带层清单与指纹，下一轮对比指纹发现断裂。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.3;fill:none}
</style>
<rect width="880" height="560" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">一次模型请求 = 左轨事件投影 ⊕ 右轨提示词层</text>
<text class="s" x="20" y="56">贯穿例子：给登录接口加限流，task 模式带计划</text>

<!-- 左轨 -->
<rect x="40" y="90" width="340" height="150" rx="12" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.5"/>
<text class="k" x="56" y="116" style="fill:#22D3EE">左轨 · buildContext</text>
<text class="s" x="56" y="138">事件历史 → 模型消息</text>
<text class="s" x="56" y="156">只进 10 类事件（user.input、</text>
<text class="s" x="56" y="172">tool.call、tool.result、model.delta…）</text>
<text class="s" x="56" y="194" style="fill:#8FA1B2">其他事件是轨迹，不进上下文</text>
<text class="s" x="56" y="214">每轮从事件流现拼</text>

<!-- 右轨 -->
<rect x="500" y="90" width="340" height="150" rx="12" fill="#17142A" stroke="#A78BFA" stroke-width="1.5"/>
<text class="k" x="516" y="116" style="fill:#A78BFA">右轨 · prompt()</text>
<text class="s" x="516" y="138">层拼装：100 → 900（见分层图）</text>
<text class="s" x="516" y="156" style="fill:#A78BFA">Soul 400 · 技能 450 动态注入</text>
<text class="s" x="516" y="174">非空才放，定格快照提供文本</text>
<text class="s" x="516" y="194">每轮现拼，不进事件流</text>
<text class="s" x="516" y="214">动态内容放进 notes（plan / env / …）</text>

<!-- 箭头到汇合 -->
<path class="ln" d="M210 240 V288" marker-end="url(#ac)"/>
<path class="ln" d="M670 240 V288" marker-end="url(#av)"/>
<text class="s" x="410" y="270">取提示词层 + notes</text>

<!-- 汇合 -->
<rect x="160" y="292" width="560" height="84" rx="12" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.6"/>
<text class="k" x="176" y="316" style="fill:#22D3EE">withPrompt 汇合</text>
<text class="s" x="176" y="338">① notes 渲染成新 user 块，追加（不改旧消息）</text>
<text class="s" x="176" y="356">② system 块置顶　③ 稳定 user 块插第二位（紧贴 system）</text>
<text class="s" x="176" y="372" style="fill:#8FA1B2">前缀 byte 级稳定——这是 prompt cache 命中的前提</text>

<path class="ln" d="M440 376 V414" marker-end="url(#ac)"/>

<!-- 输出 -->
<rect class="box" x="160" y="416" width="560" height="70" rx="12"/>
<text class="k" x="176" y="440">generate(messages)</text>
<text class="s" x="176" y="460">落 model.request：ctx.layers（每层内容与哈希）+ fingerprint（FNV-1a）</text>
<text class="s" x="176" y="476">厂商缓存参数：anthropic cache_control / openai prompt_cache_key</text>

<!-- 指纹观测 -->
<path d="M440 486 V500" fill="none" stroke="#A78BFA" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="200" y="504" width="480" height="42" rx="10" fill="#17142A" stroke="#A78BFA" stroke-width="1.3"/>
<text class="s" x="216" y="522" style="fill:#A78BFA">下一轮生成前：fingerprintOf 对比 → locateBreak 定位断裂 → 落 ctx.prefix.break 观测事件</text>
<text class="s" x="216" y="538" style="fill:#8FA1B2">断裂不阻断：请求照常发，只是少一次缓存命中</text>
</svg>
