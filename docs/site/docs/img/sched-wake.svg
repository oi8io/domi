<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="t d">
<title id="t">调度器醒来逻辑</title>
<desc id="d">调度器每次醒来：算「不晚于现在的最近应触发时刻」，晚于 last_due 就触发一次（错过多个周期也只补最近这一次），醒来的间隔最长 60 秒。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker>
  <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .st{fill:#0F1E26;stroke:#22D3EE;stroke-width:1.4}
  .warn{fill:#17142A;stroke:#FBBF24;stroke-width:1.4}
  .ok{fill:#0C2016;stroke:#4ADE80;stroke-width:1.4}
  .bad{fill:#17141E;stroke:#F87171;stroke-width:1.4}
</style>
<rect width="880" height="460" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">调度器每次醒来，只问一个问题</text>
<text class="s" x="20" y="56">「最近应触发时刻」晚于 last_due 吗？—— 是就触发一次（错过多个周期也只补最近这一次）</text>

<rect class="st" x="60" y="90" width="280" height="52" rx="10"/>
<text class="k" x="76" y="112">① 醒来</text>
<text class="s" x="76" y="130">间隔 = 到最近运行的时间，最长 60 秒</text>
<path d="M340 116 H376" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>

<rect class="st" x="386" y="90" width="320" height="52" rx="10"/>
<text class="k" x="402" y="112">② 算最近应触发时刻</text>
<text class="s" x="402" y="130">nextRun 纯函数 · Intl 时区换算</text>
<path d="M706 116 H740" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>

<rect class="warn" x="750" y="90" width="110" height="52" rx="10"/>
<text class="k" x="762" y="112" style="fill:#FBBF24">③ 比较</text>
<text class="s" x="762" y="130">vs last_due</text>

<!-- 分支 -->
<path d="M805 142 V178" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="s" x="820" y="168">晚于</text>

<rect class="ok" x="640" y="182" width="220" height="86" rx="10"/>
<text class="k" x="656" y="204" style="fill:#4ADE80">触发一次</text>
<text class="s" x="656" y="224">fire(schedule, due, late)</text>
<text class="s" x="656" y="240">错过多个周期也只补最近这一次</text>
<text class="s" x="656" y="256">其余 skipped 记 schedule_runs</text>

<path d="M60 116 V316" fill="none" stroke="#8FA1B2" stroke-width="1.3"/>
<text class="s" x="30" y="210">不晚于</text>
<path d="M150 142 V178 H628" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>

<rect class="box" x="60" y="182" width="300" height="62" rx="10"/>
<text class="k" x="76" y="204">不触发</text>
<text class="s" x="76" y="222">应触发时刻在未来 / 已处理过</text>
<text class="s" x="76" y="238">等下一个周期</text>

<!-- 底部 -->
<rect class="warn" x="60" y="300" width="760" height="108" rx="10"/>
<text class="k" x="76" y="324" style="fill:#FBBF24">准点 / late</text>
<text class="s" x="76" y="346">应触发时刻之后 60 秒内触发 → 准点（late=false）</text>
<text class="s" x="76" y="364">超过 60 秒 → late（domid 没开、机器睡着了）</text>
<text class="s" x="76" y="382">late 标志进 schedule.fire 事件 · isBusy 防止同一会话叠跑</text>
<text class="s" x="76" y="400">daemon 重启后 resumeRuns 把没跑完的接着跑</text>

<text class="s" x="20" y="440">cron 5 段：分 时 日 月 周 · 支持 * , - / 与英文缩写 · 不支持 L W # 与秒 · 日与周都限定时取「或」</text>
</svg>
