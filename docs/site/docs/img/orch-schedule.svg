<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">定时任务的触发规则</title>
<desc id="d">错过多个周期只补最近一次并标记迟到；上一次还在跑时跳过本次。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .h{font-size:15px;font-weight:700}
  .s{font-size:12px;fill:#8FA1B2}
  .t{font-size:12.5px}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11.5px;fill:#8FA1B2}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.4;fill:none}
</style>
<rect width="880" height="300" rx="14" fill="#0D141B"/>
<text class="k" x="20" y="30" style="fill:#22D3EE">定时任务「每天 09:00」：错过只补一次，上一次没做完就跳过</text>
<rect x="170" y="56" width="458" height="132" rx="8" fill="#151B22" stroke="#2A3B4D" stroke-dasharray="4 3"/>
<text class="s" x="399" y="180" text-anchor="middle">电脑睡着了，domid 没在跑</text>
<path d="M60 120 H840" stroke="#2A3B4D" stroke-width="2"/>
<path d="M100 112 V128" stroke="#8FA1B2" stroke-width="1.5"/>
<text class="s" x="100" y="148" text-anchor="middle">周一 09:00</text>
<path d="M250 112 V128" stroke="#8FA1B2" stroke-width="1.5"/>
<text class="s" x="250" y="148" text-anchor="middle">周二 09:00</text>
<path d="M400 112 V128" stroke="#8FA1B2" stroke-width="1.5"/>
<text class="s" x="400" y="148" text-anchor="middle">周三 09:00</text>
<path d="M550 112 V128" stroke="#8FA1B2" stroke-width="1.5"/>
<text class="s" x="550" y="148" text-anchor="middle">周四 09:00</text>
<path d="M790 112 V128" stroke="#8FA1B2" stroke-width="1.5"/>
<text class="s" x="790" y="148" text-anchor="middle">周五 09:00</text>
<circle cx="100" cy="120" r="7" fill="#4ADE80"/>
<text class="t" x="100" y="102" text-anchor="middle" style="fill:#4ADE80">准点触发</text>
<circle cx="250" cy="120" r="7" fill="#0D141B" stroke="#8FA1B2" stroke-width="1.5"/>
<text class="s" x="250" y="102" text-anchor="middle">错过</text>
<circle cx="400" cy="120" r="7" fill="#0D141B" stroke="#8FA1B2" stroke-width="1.5"/>
<text class="s" x="400" y="102" text-anchor="middle">错过</text>
<circle cx="618" cy="120" r="7" fill="#FBBF24"/>
<text class="t" x="630" y="90" text-anchor="middle" style="fill:#FBBF24">周四 10:30 醒来</text>
<text class="s" x="630" y="106" text-anchor="middle" style="fill:#FBBF24">只补一次，记为迟到</text>
<circle cx="790" cy="120" r="7" fill="#0D141B" stroke="#F87171" stroke-width="1.5"/>
<text class="t" x="790" y="90" text-anchor="middle" style="fill:#F87171">跳过</text>
<text class="s" x="790" y="106" text-anchor="middle" style="fill:#F87171">周四那次还没做完</text>
<text class="s" x="20" y="214">· 醒来时只看「最近一个该触发的时刻」：周二、周三不补，只补周四这一次。超过应触发时刻 60 秒就算迟到。</text>
<text class="s" x="20" y="236">· 触发前先记下「这个时刻处理过了」，所以触发途中崩溃也不会重复建任务。</text>
<text class="s" x="20" y="258">· 上一次还在跑（比如正等你确认一个操作），这一次就跳过，并记一条「跳过」。</text>
<text class="s" x="20" y="280">· 项目是有提交的 git 仓库时，定时任务在单独的工作区（git worktree）里做，不动你手上的代码。</text>
</svg>
