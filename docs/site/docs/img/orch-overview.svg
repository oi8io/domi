<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">从一句目标到做完：两条执行路线</title>
<desc id="d">你给出目标，domi 建任务会话，先写计划，按确认模式决定要不要你批准；批准后在本会话里按步骤做，或转成后台长任务，每步一个新会话。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .h{font-size:15px;font-weight:700}
  .s{font-size:12px;fill:#8FA1B2}
  .k{font-size:12px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11.5px;fill:#8FA1B2}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.4;fill:none}
</style>
<rect width="880" height="420" rx="14" fill="#0D141B"/>

<!-- 主干 -->
<rect class="box" x="16" y="70" width="106" height="64" rx="10"/>
<text class="h" x="69" y="98" text-anchor="middle">你的目标</text>
<text class="s" x="69" y="118" text-anchor="middle">一句话就行</text>
<path class="ln" d="M122 102 H140" marker-end="url(#a)"/>

<rect class="box" x="142" y="70" width="118" height="64" rx="10"/>
<text class="h" x="201" y="98" text-anchor="middle">任务会话</text>
<text class="s" x="201" y="118" text-anchor="middle">挂在一个项目下</text>
<path class="ln" d="M260 102 H278" marker-end="url(#a)"/>

<rect x="280" y="62" width="154" height="80" rx="10" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.4"/>
<text class="h" x="357" y="92" text-anchor="middle" style="fill:#22D3EE">先写计划</text>
<text class="s" x="357" y="112" text-anchor="middle">1–40 步，每步有状态</text>
<text class="mono" x="357" y="130" text-anchor="middle">plan.update</text>
<path class="ln" d="M434 102 H456" marker-end="url(#a)"/>

<!-- 判断 -->
<path d="M520 50 L582 102 L520 154 L458 102 Z" fill="#1A1A10" stroke="#FBBF24" stroke-width="1.4"/>
<text class="k" x="520" y="98" text-anchor="middle" style="fill:#FBBF24">要你批准吗？</text>
<text class="s" x="520" y="116" text-anchor="middle">看确认模式</text>

<!-- 要修改：回到计划 -->
<path d="M520 154 V184 H357 V146" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aa)"/>
<text class="s" x="438" y="204" text-anchor="middle" style="fill:#FBBF24">选「要修改」：模型按你的意见重写计划，再请你看</text>

<!-- 分支 A -->
<path d="M582 102 H608 V58 H696" fill="none" stroke="#22D3EE" stroke-width="1.4" marker-end="url(#ac)"/>
<text class="s" x="652" y="50" text-anchor="middle">不需要 / 已批准</text>
<rect x="698" y="14" width="166" height="88" rx="10" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.4"/>
<text class="k" x="712" y="38" style="fill:#22D3EE">路线 A · 默认</text>
<text class="h" x="712" y="62">在本会话里按步骤做</text>
<text class="s" x="712" y="84">同一个模型从头做到尾</text>

<!-- 分支 B -->
<path d="M608 102 V158 H696" fill="none" stroke="#A78BFA" stroke-width="1.4" marker-end="url(#av)"/>
<text class="s" x="652" y="176" text-anchor="middle">批准并转成</text>
<text class="s" x="652" y="192" text-anchor="middle">长任务（≥3 步）</text>
<rect x="698" y="112" width="166" height="96" rx="10" fill="#17142A" stroke="#A78BFA" stroke-width="1.4"/>
<text class="k" x="712" y="138" style="fill:#A78BFA">路线 B · 长任务</text>
<text class="h" x="712" y="162">后台逐步执行</text>
<text class="s" x="712" y="182">每步一个新会话</text>
<text class="s" x="712" y="200">按依赖顺序，一次一步</text>

<!-- 底部：每一步都要过的闸 -->
<text class="k" x="20" y="246" style="fill:#8FA1B2">两条路线里，模型每次动手（改文件、跑命令、联网……）之前都要过三道闸：</text>
<rect class="box" x="20" y="260" width="268" height="70" rx="10"/>
<text class="k" x="36" y="285" style="fill:#22D3EE">① 计划闸</text>
<text class="s" x="36" y="305">任务里没计划，不许动手</text>
<text class="s" x="36" y="321">需要批准而没批准，只许读</text>

<rect class="box" x="306" y="260" width="268" height="70" rx="10"/>
<text class="k" x="322" y="285" style="fill:#FBBF24">② 用量上限</text>
<text class="s" x="322" y="305">到 80% 提醒一次</text>
<text class="s" x="322" y="321">到顶暂停，问你继续还是停</text>

<rect class="box" x="592" y="260" width="268" height="70" rx="10"/>
<text class="k" x="608" y="285" style="fill:#4ADE80">③ 权限</text>
<text class="s" x="608" y="305">按你的规则：放行 / 问你 / 拒绝</text>
<text class="s" x="608" y="321">没有规则的能力，默认拒绝</text>

<rect x="20" y="346" width="840" height="56" rx="10" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.2"/>
<text class="k" x="36" y="370" style="fill:#4ADE80">每一步的开始、结果、批准、拒绝，都先写进会话记录。</text>
<text class="s" x="36" y="390">进度是从记录算出来的。进程重启或网络断开后，重读记录就知道停在哪一步。</text>
</svg>
