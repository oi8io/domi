<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t d">
<title id="t">提示词层与优先级</title>
<desc id="d">priority 500 以下（含）是稳定前缀，800 与 900 是会变层。Soul 400 与技能 450 是运行时动态注入，非空才放。</desc>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .stab{fill:#111A23;stroke:#22D3EE;stroke-width:1.4;stroke-dasharray:5 4}
  .volt{fill:#111A23;stroke:#FBBF24;stroke-width:1.4;stroke-dasharray:5 4}
  .lrow{fill:#0F1E26;stroke:#2A3B4D;stroke-width:1.2}
  .dyn{fill:#17142A;stroke:#A78BFA;stroke-width:1.3}
</style>
<rect width="880" height="440" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">提示词是一串有序的层：priority 越小越靠前</text>
<text class="s" x="20" y="56">同一 role 的层按 priority 从小到大拼；role 只有 system / user 两档</text>

<!-- 稳定前缀区 -->
<rect class="stab" x="20" y="76" width="560" height="296" rx="12"/>
<text class="k" x="36" y="98" style="fill:#22D3EE">稳定前缀（priority ≤500，cacheable）</text>

<rect class="lrow" x="36" y="108" width="528" height="32" rx="6"/>
<text class="mono" x="48" y="129">100</text><text class="k" x="92" y="129">identity</text><text class="s" x="250" y="129">我是谁（按模式分段：chat / task / subagent）</text><text class="s" x="500" y="129" style="fill:#4ADE80">✓</text>

<rect class="lrow" x="36" y="146" width="528" height="32" rx="6"/>
<text class="mono" x="48" y="167">150</text><text class="k" x="92" y="167">guardrail</text><text class="s" x="250" y="167">注入防护——先立规矩，再说能力</text><text class="s" x="500" y="167" style="fill:#4ADE80">✓</text>

<rect class="lrow" x="36" y="184" width="528" height="32" rx="6"/>
<text class="mono" x="48" y="205">200</text><text class="k" x="92" y="205">capabilities</text><text class="s" x="250" y="205">工具能力声明</text><text class="s" x="500" y="205" style="fill:#4ADE80">✓</text>

<rect class="lrow" x="36" y="222" width="528" height="32" rx="6"/>
<text class="mono" x="48" y="243">300</text><text class="k" x="92" y="243">conventions</text><text class="s" x="250" y="243">会话惯例 / 输出约定</text><text class="s" x="500" y="243" style="fill:#4ADE80">✓</text>

<rect class="dyn" x="36" y="260" width="528" height="32" rx="6"/>
<text class="mono" x="48" y="281">400</text><text class="k" x="92" y="281" style="fill:#A78BFA">soul *</text><text class="s" x="250" y="281">动态注入：定格取 Soul，非空才放</text><text class="s" x="500" y="281" style="fill:#4ADE80">✓</text>

<rect class="dyn" x="36" y="298" width="528" height="32" rx="6"/>
<text class="mono" x="48" y="319">450</text><text class="k" x="92" y="319" style="fill:#A78BFA">skills *</text><text class="s" x="250" y="319">技能清单（只列不装），非空才放</text><text class="s" x="500" y="319" style="fill:#4ADE80">✓</text>

<rect class="lrow" x="36" y="336" width="528" height="32" rx="6"/>
<text class="mono" x="48" y="357">500</text><text class="k" x="92" y="357">userStatic</text><text class="s" x="250" y="357">用户自定义层的默认落点</text><text class="s" x="500" y="357" style="fill:#4ADE80">✓</text>

<!-- 会变区 -->
<rect class="volt" x="610" y="76" width="250" height="146" rx="12"/>
<text class="k" x="626" y="98" style="fill:#FBBF24">会变层（每轮重拼）</text>
<rect class="lrow" x="626" y="108" width="218" height="40" rx="6"/>
<text class="mono" x="638" y="124">800</text><text class="k" x="682" y="124">workspace</text>
<text class="s" x="638" y="140">工作区 / 项目上下文</text><text class="s" x="830" y="124" style="fill:#FBBF24">✗</text>
<rect class="lrow" x="626" y="154" width="218" height="40" rx="6"/>
<text class="mono" x="638" y="170">900</text><text class="k" x="682" y="170">dynamic</text>
<text class="s" x="638" y="186">计划 / 轮级动态内容</text><text class="s" x="830" y="170" style="fill:#FBBF24">✗</text>

<!-- 底部注 -->
<text class="s" x="20" y="404">会变层不能标成 cacheable——CacheBoundaryError 在构建期抛错。* = 运行时动态注入，源码的 builtin.ts 里没有这两层</text>
<text class="s" x="20" y="424">编号留了间隔（100 / 150 / 200 …）：你插自定义层时，不用改内置层编号</text>
</svg>
