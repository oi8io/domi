<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">路线 B：长任务里第 2 步失败</title>
<desc id="d">有依赖时下游被挡住，重试只重开失败节点及其下游；无依赖时其他步骤照跑；进程被杀后重启自动从中断的节点重跑。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .h{font-size:15px;font-weight:700}
  .s{font-size:12px;fill:#8FA1B2}
  .t{font-size:12.5px}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11.5px;fill:#8FA1B2}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.4;fill:none}
</style>
<rect width="880" height="640" rx="14" fill="#0D141B"/>
<text class="k" x="20" y="30" style="fill:#A78BFA">路线 B：计划转成长任务，第 ② 步失败</text>
<text class="s" x="20" y="52">每一步变成一个节点。每个节点开一个新会话去做。节点按依赖排队，一次跑一个。</text>
<rect class="box" x="20" y="68" width="410" height="300" rx="10"/>
<text class="k" x="36" y="94">写了依赖：① → ② → ③ → ④</text>
<rect x="36" y="108" width="84" height="46" rx="9" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.3"/>
<text class="k" x="78.0" y="128" text-anchor="middle">①</text>
<text class="s" x="78.0" y="145" text-anchor="middle" style="fill:#4ADE80">完成</text>
<path d="M120 131 H131" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="132" y="108" width="84" height="46" rx="9" fill="#221316" stroke="#F87171" stroke-width="1.3"/>
<text class="k" x="174.0" y="128" text-anchor="middle">②</text>
<text class="s" x="174.0" y="145" text-anchor="middle" style="fill:#F87171">失败</text>
<path d="M216 131 H227" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="228" y="108" width="84" height="46" rx="9" fill="#111A23" stroke="#8FA1B2" stroke-width="1.3" stroke-dasharray="4 3"/>
<text class="k" x="270.0" y="128" text-anchor="middle">③</text>
<text class="s" x="270.0" y="145" text-anchor="middle">被挡住</text>
<path d="M312 131 H323" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="324" y="108" width="84" height="46" rx="9" fill="#111A23" stroke="#8FA1B2" stroke-width="1.3" stroke-dasharray="4 3"/>
<text class="k" x="366.0" y="128" text-anchor="middle">④</text>
<text class="s" x="366.0" y="145" text-anchor="middle">被挡住</text>
<text class="s" x="36" y="180">② 失败，依赖它的 ③ ④ 被挡住，不会执行。</text>
<text class="s" x="36" y="198">没有能跑的节点了，整个运行记为「失败」。</text>
<rect x="36" y="212" width="378" height="30" rx="7" fill="#1A1A10" stroke="#FBBF24"/>
<text class="t" x="48" y="232" style="fill:#FBBF24">你在界面上对 ② 点「重试」</text>
<path d="M225 242 V258" fill="none" stroke="#FBBF24" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="36" y="262" width="84" height="46" rx="9" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.3"/>
<text class="k" x="78.0" y="282" text-anchor="middle">①</text>
<text class="s" x="78.0" y="299" text-anchor="middle" style="fill:#4ADE80">完成</text>
<path d="M120 285 H131" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="132" y="262" width="84" height="46" rx="9" fill="#1A1A10" stroke="#FBBF24" stroke-width="1.3"/>
<text class="k" x="174.0" y="282" text-anchor="middle">②</text>
<text class="s" x="174.0" y="299" text-anchor="middle" style="fill:#FBBF24">待跑 · 第 2 次</text>
<path d="M216 285 H227" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="228" y="262" width="84" height="46" rx="9" fill="#1A1A10" stroke="#FBBF24" stroke-width="1.3"/>
<text class="k" x="270.0" y="282" text-anchor="middle">③</text>
<text class="s" x="270.0" y="299" text-anchor="middle" style="fill:#FBBF24">待跑</text>
<path d="M312 285 H323" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="324" y="262" width="84" height="46" rx="9" fill="#1A1A10" stroke="#FBBF24" stroke-width="1.3"/>
<text class="k" x="366.0" y="282" text-anchor="middle">④</text>
<text class="s" x="366.0" y="299" text-anchor="middle" style="fill:#FBBF24">待跑</text>
<text class="s" x="36" y="334">① 不动。② 重新打开，③ ④ 自动解除挡住，</text>
<text class="s" x="36" y="352">按顺序接着跑。</text>
<rect class="box" x="450" y="68" width="410" height="300" rx="10"/>
<text class="k" x="466" y="94">没写依赖：四步互相独立</text>
<rect x="466" y="108" width="84" height="46" rx="9" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.3"/>
<text class="k" x="508.0" y="128" text-anchor="middle">①</text>
<text class="s" x="508.0" y="145" text-anchor="middle" style="fill:#4ADE80">完成</text>
<rect x="562" y="108" width="84" height="46" rx="9" fill="#221316" stroke="#F87171" stroke-width="1.3"/>
<text class="k" x="604.0" y="128" text-anchor="middle">②</text>
<text class="s" x="604.0" y="145" text-anchor="middle" style="fill:#F87171">失败</text>
<rect x="658" y="108" width="84" height="46" rx="9" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.3"/>
<text class="k" x="700.0" y="128" text-anchor="middle">③</text>
<text class="s" x="700.0" y="145" text-anchor="middle" style="fill:#4ADE80">完成</text>
<rect x="754" y="108" width="84" height="46" rx="9" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.3"/>
<text class="k" x="796.0" y="128" text-anchor="middle">④</text>
<text class="s" x="796.0" y="145" text-anchor="middle" style="fill:#4ADE80">完成</text>
<text class="s" x="466" y="180">② 失败不挡别人：③ ④ 照常执行。</text>
<text class="s" x="466" y="198">有一步失败，整个运行仍记为「失败」。</text>
<rect x="466" y="212" width="378" height="30" rx="7" fill="#1A1A10" stroke="#FBBF24"/>
<text class="t" x="478" y="232" style="fill:#FBBF24">你对 ② 点「重试」：只重跑 ②</text>
<path d="M655 242 V258" fill="none" stroke="#FBBF24" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="466" y="262" width="84" height="46" rx="9" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.3"/>
<text class="k" x="508.0" y="282" text-anchor="middle">①</text>
<text class="s" x="508.0" y="299" text-anchor="middle" style="fill:#4ADE80">完成</text>
<rect x="562" y="262" width="84" height="46" rx="9" fill="#1A1A10" stroke="#FBBF24" stroke-width="1.3"/>
<text class="k" x="604.0" y="282" text-anchor="middle">②</text>
<text class="s" x="604.0" y="299" text-anchor="middle" style="fill:#FBBF24">待跑 · 第 2 次</text>
<rect x="658" y="262" width="84" height="46" rx="9" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.3"/>
<text class="k" x="700.0" y="282" text-anchor="middle">③</text>
<text class="s" x="700.0" y="299" text-anchor="middle" style="fill:#4ADE80">完成</text>
<rect x="754" y="262" width="84" height="46" rx="9" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.3"/>
<text class="k" x="796.0" y="282" text-anchor="middle">④</text>
<text class="s" x="796.0" y="299" text-anchor="middle" style="fill:#4ADE80">完成</text>
<text class="s" x="466" y="334" style="fill:#FBBF24">注意：转长任务时只按计划里的 dependsOn 建依赖。</text>
<text class="s" x="466" y="352" style="fill:#FBBF24">后面的步骤要用前面的结果，就在计划里写明依赖。</text>
<rect class="box" x="20" y="386" width="840" height="160" rx="10"/>
<text class="k" x="36" y="412" style="fill:#F87171">domid 在 ② 执行到一半被杀掉（断电、kill -9、系统重启）</text>
<path d="M48 446 H840" stroke="#2A3B4D" stroke-width="2"/>
<circle cx="48" cy="446" r="6" fill="#4ADE80"/>
<text class="t" x="36" y="474" style="fill:#4ADE80">① 完成</text>
<circle cx="182" cy="446" r="6" fill="#8FA1B2"/>
<text class="t" x="170" y="474">② 开始 · 第 1 次</text>
<circle cx="342" cy="446" r="6" fill="#F87171"/>
<text class="t" x="330" y="474" style="fill:#F87171">✕ 进程被杀</text>
<circle cx="482" cy="446" r="6" fill="#A78BFA"/>
<text class="t" x="470" y="474" style="fill:#A78BFA">重启：记一条「恢复」</text>
<circle cx="672" cy="446" r="6" fill="#FBBF24"/>
<text class="t" x="660" y="474" style="fill:#FBBF24">② 开始 · 第 2 次</text>
<text class="mono" x="470" y="494">已完成 = [①]，要重跑 = [②]</text>
<text class="s" x="660" y="494">开一个新会话，从头做 ②</text>
<text class="s" x="36" y="526">不需要你操作：domid 启动时会接着跑所有没结束的运行。被打断的步骤至少会执行一次，所以步骤要能安全地重复执行。</text>
<text class="s" x="20" y="576">节点之间只传结论：上游的输出（最多 4000 字）作为参考资料，接在下游的提示词后面，不当作指令。</text>
<text class="s" x="20" y="598">节点失败不会自动重试，要你点「重试」。「取消」会停掉整个运行，状态记为「已取消」。</text>
<text class="s" x="20" y="620">节点里遇到要确认的操作，询问转到运行会话里问你；节点内部的报错处理和路线 A 一样。</text>
</svg>
