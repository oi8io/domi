<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d">
<title id="t">评估体系 L1 / L2</title>
<desc id="d">L1 确定性回放：录制的 SSE 流 + 真实 kernel，无网可进 CI；L2 端到端：真模型，题=目录，临时目录隔离，只进 nightly。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .st{fill:#0F1E26;stroke:#22D3EE;stroke-width:1.4}
  .warn{fill:#17142A;stroke:#FBBF24;stroke-width:1.4}
  .ok{fill:#0C2016;stroke:#4ADE80;stroke-width:1.4}
  .bad{fill:#17141E;stroke:#F87171;stroke-width:1.4}
</style>
<rect width="880" height="470" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">评估以事件流回放为唯一数据源，不新增埋点</text>

<!-- L1 -->
<rect class="st" x="60" y="76" width="390" height="180" rx="12"/>
<text class="k" x="76" y="100">L1 确定性回放（进 CI）</text>
<text class="s" x="76" y="122">回放的是模型与工具，跑的是真的 kernel</text>
<text class="s" x="76" y="140">真的 buildContext · runTurn · 终止条件</text>
<text class="s" x="76" y="158">fixture = 原始 SSE 响应流（不是结果）</text>
<text class="s" x="76" y="176">只有「模型推理」被固定住</text>
<text class="s" x="76" y="194">工具 / 权限 / 压缩全部真实跑</text>
<text class="s" x="76" y="212">不花钱 · 不联网（assertNoNetwork）</text>
<text class="s" x="76" y="230">判据：工具序列 + 事件流等价</text>
<text class="s" x="76" y="248">对不上 → Divergence{index, expected, actual, seq}</text>

<path d="M450 170 H510" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="s" x="458" y="160">录制</text>

<rect class="ok" x="520" y="76" width="300" height="180" rx="12"/>
<text class="k" x="536" y="100" style="fill:#4ADE80">fixtures/sessions/</text>
<text class="s" x="536" y="122">跟着代码进版本库</text>
<text class="s" x="536" y="140">测试资产，不是用户数据</text>
<text class="s" x="536" y="158">domi eval record &lt;sessionId&gt;</text>
<text class="s" x="536" y="176">数据只有事件流（INV-13）</text>
<text class="s" x="536" y="194">check-eval-isolation：删掉 eval</text>
<text class="s" x="536" y="212">kernel / store 测试仍全绿</text>

<!-- L2 -->
<rect class="warn" x="60" y="280" width="390" height="150" rx="12"/>
<text class="k" x="76" y="304" style="fill:#FBBF24">L2 端到端（不进 CI）</text>
<text class="s" x="76" y="326">真模型 · nightly / 手动</text>
<text class="s" x="76" y="344">一题 = 一个目录</text>
<text class="s" x="76" y="362">task.yaml + workspace/ + check.ts</text>
<text class="s" x="76" y="380">每次复制到新临时目录跑</text>
<text class="s" x="76" y="398">题与题无残留 · check 退出码 0 = 通过</text>

<rect class="bad" x="520" y="280" width="300" height="150" rx="12"/>
<text class="k" x="536" y="304" style="fill:#F87171">金字塔（ENGINEERING.md）</text>
<text class="s" x="536" y="326">纯函数单测 ~70% ✅ CI</text>
<text class="s" x="536" y="344">录制回放（L1）~25% ✅ CI</text>
<text class="s" x="536" y="362">真实 eval（L2）~5% ❌ 不进 CI</text>
<text class="s" x="536" y="380">harness 不认识模型：调用方注入</text>
<text class="s" x="536" y="398">mine.ts 从 git 历史挖题</text>

<text class="s" x="20" y="452">check-ac-coverage.ts：PRD AC ↔ 测试点名对照 · ACTIVE 正则决定强制里程碑 · 这是唯一防回退的机制</text>
</svg>
