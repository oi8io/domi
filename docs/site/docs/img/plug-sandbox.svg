<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-labelledby="t d">
<title id="t">插件沙箱边界</title>
<desc id="d">插件进程无网络、看不到用户文件；读写与请求都经 ctx，宿主按 permissions 核对；没声明即拒绝并记权限事件。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .st{fill:#0F1E26;stroke:#22D3EE;stroke-width:1.4}
  .warn{fill:#17142A;stroke:#FBBF24;stroke-width:1.4}
  .ok{fill:#0C2016;stroke:#4ADE80;stroke-width:1.4}
  .bad{fill:#17141E;stroke:#F87171;stroke-width:1.4}
</style>
<rect width="880" height="480" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">沙箱：没有网络，看不到用户文件</text>
<text class="s" x="20" y="56">Linux bubblewrap · macOS sandbox-exec · detectSandbox 探测（bwrap / sandbox-exec / none）</text>

<!-- 沙箱 -->
<rect class="warn" x="60" y="90" width="420" height="230" rx="14"/>
<text class="k" x="76" y="114" style="fill:#FBBF24">沙箱内插件进程</text>
<text class="s" x="76" y="136">无网络 · 看不到用户文件</text>
<text class="s" x="76" y="156">读写 / 请求都经 ctx</text>
<text class="s" x="76" y="196">ctx 通道</text>
<text class="s" x="76" y="214">readFile(path) → permissions.read（工作目录内 glob）</text>
<text class="s" x="76" y="232">writeFile(path) → permissions.write</text>
<text class="s" x="76" y="250">fetch(url) → permissions.hosts（*.example.com 匹配子域）</text>
<text class="s" x="76" y="268">log(message) → 无权限要求</text>
<text class="s" x="76" y="288">没声明的被拒绝 + 记权限事件</text>
<path d="M480 180 H520" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="s" x="488" y="170">核对</text>

<!-- 宿主 -->
<rect class="st" x="530" y="90" width="290" height="230" rx="14"/>
<text class="k" x="546" y="114">宿主核对（PluginHost）</text>
<text class="s" x="546" y="136">permissions 里有的 → 放行</text>
<text class="s" x="546" y="154">没有的 → 拒绝 + 事件</text>
<text class="s" x="546" y="196">超时 → 强杀（timeoutMs）</text>
<text class="s" x="546" y="214">崩溃 → 调用失败 + plugin.error</text>
<text class="s" x="546" y="232">不影响 domi 其它功能</text>
<text class="s" x="546" y="252">problems() 启动时写 stderr</text>
<text class="s" x="546" y="270">allowUnsandboxed 可跳过沙箱</text>

<!-- 两层边界 -->
<rect class="ok" x="60" y="350" width="760" height="86" rx="10"/>
<text class="k" x="76" y="374" style="fill:#4ADE80">两层边界要分清</text>
<text class="s" x="76" y="396">沙箱管「看不见」：插件进程没有网络、看不到用户文件</text>
<text class="s" x="76" y="414">权限规则管「允不允许」：用户仍要在规则里放行 plugin.&lt;插件名&gt;.*（或设为 ask）</text>
<text class="s" x="76" y="432" style="fill:#8FA1B2">沙箱放过了不代表能执行——权限引擎默认拒绝</text>

<text class="s" x="20" y="470">热启停：只有「启动时就停用、且带 MCP server 的插件被重新启用」才回 restartRequired</text>
</svg>
