<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t d">
<title id="t">连接与消息</title>
<desc id="d">客户端先握手，版本匹配后调方法；daemon 产生的事件作为通知推送。未握手调方法返回 NOT_HANDSHAKED。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .msg{fill:#0F1E26;stroke:#22D3EE;stroke-width:1.2}
  .warn{fill:#17142A;stroke:#FBBF24;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.3;fill:none}
</style>
<rect width="880" height="440" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">一次连接：握手 → 方法 → 事件通知</text>
<text class="s" x="20" y="56">JSON-RPC 2.0 · stdio（本地）/ WebSocket（远程）</text>

<!-- 泳道 -->
<rect x="40" y="80" width="360" height="330" rx="10" fill="#111A23" opacity="0.55"/>
<text class="k" x="56" y="106">客户端（TUI / Web / 桌面）</text>
<rect x="480" y="80" width="360" height="330" rx="10" fill="#111A23" opacity="0.55"/>
<text class="k" x="496" y="106">daemon（唯一真相来源）</text>

<!-- ① 握手 -->
<rect class="msg" x="480" y="130" width="200" height="40" rx="8"/>
<text class="mono" x="496" y="156">handshake{ver:1}</text>
<path d="M440 150 H468" fill="none" class="ln" marker-end="url(#ac)"/>
<text class="s" x="396" y="140">① 第一个请求</text>
<rect class="warn" x="480" y="186" width="320" height="52" rx="8"/>
<text class="s" x="496" y="207" style="fill:#FBBF24">不匹配 → PROTOCOL_VERSION_MISMATCH</text>
<text class="s" x="496" y="225" style="fill:#8FA1B2">双方版本号都在 data 里；不降级、不重连</text>
<path d="M440 170 V206" fill="none" class="ln" marker-end="url(#aw)"/>

<!-- ② 方法 -->
<rect class="box" x="56" y="256" width="200" height="40" rx="8"/>
<text class="mono" x="72" y="282">session.submit{…}</text>
<path d="M256 276 H468" fill="none" class="ln" marker-end="url(#ac)"/>
<text class="s" x="300" y="266">② 方法：有 id，有回复</text>
<rect class="box" x="480" y="256" width="180" height="40" rx="8"/>
<text class="mono" x="496" y="282">result{…}</text>
<path d="M468 276 H440" fill="none" class="ln" marker-end="url(#a)"/>

<!-- ③ 事件通知 -->
<rect class="msg" x="480" y="320" width="280" height="56" rx="8"/>
<text class="mono" x="496" y="342">session.events{seqs:[n..n+k]}</text>
<text class="mono" x="496" y="360">（通知：没有 id）</text>
<path d="M468 348 H440" fill="none" class="ln" marker-end="url(#a)"/>
<text class="s" x="330" y="340">③ 事件推送：不轮询</text>
<text class="s" x="330" y="358">客户端只提交意图</text>

<text class="s" x="20" y="424">未握手就调其它方法 → NOT_HANDSHAKED。同一会话串行：忙时回 SESSION_BUSY，不排队、不静默丢弃</text>
</svg>
