<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-labelledby="t d">
<title id="t">一轮对话的总体流程</title>
<desc id="d">你说一句话，domi 先定格一份快照，再按预算器预检；然后 kernel 循环把事件投影与提示词层汇合，生成、落盘、执行工具；最后按终止条件收场。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .h{font-size:15px;font-weight:700}
  .s{font-size:12px;fill:#8FA1B2}
  .k{font-size:12px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11.5px;fill:#8FA1B2}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.4;fill:none}
</style>
<rect width="880" height="640" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">一轮（turn）= 从你说一句话，到 domi 停下</text>
<text class="s" x="20" y="56">贯穿例子：给登录接口加限流，正在写第 2 步「限流中间件」</text>

<!-- 1 提交 -->
<rect class="box" x="330" y="80" width="220" height="58" rx="10"/>
<text class="k" x="360" y="104" style="fill:#22D3EE">① 你说一句话</text>
<text class="s" x="360" y="124">session.submit 落 user.input</text>
<path class="ln" d="M440 138 V166" marker-end="url(#ac)"/>

<!-- 2 定格 -->
<rect x="180" y="168" width="520" height="92" rx="10" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.4"/>
<text class="k" x="200" y="192" style="fill:#22D3EE">② 定格（freeze）：一次取齐，本轮不现读</text>
<text class="s" x="200" y="214">Soul · 仓库规矩 · 技能 · 计划 · 环境</text>
<text class="s" x="200" y="234">来源变化下一轮生效，或手动 ctx.refresh</text>
<path class="ln" d="M440 260 V288" marker-end="url(#ac)"/>

<!-- 3 预检 -->
<path d="M440 290 L520 346 L440 402 L360 346 Z" fill="#1A1A10" stroke="#FBBF24" stroke-width="1.4"/>
<text class="k" x="440" y="340" text-anchor="middle" style="fill:#FBBF24">上下文够吗？</text>
<text class="s" x="440" y="360" text-anchor="middle">预算器估占用</text>

<!-- 硬顶分支 -->
<path d="M520 346 H570" fill="none" stroke="#F87171" stroke-width="1.4" marker-end="url(#ar)"/>
<text class="s" x="580" y="320" style="fill:#F87171">占用 ≥92%：本轮停</text>
<text class="s" x="580" y="338" style="fill:#F87171">落 error{scope:context,recoverable}</text>
<text class="s" x="580" y="356" style="fill:#F87171">告诉你怎么办</text>

<!-- 降级分支 -->
<path d="M440 402 V428 H250" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text class="s" x="260" y="446" style="fill:#FBBF24">超 60%：遮蔽旧工具输出（ctx.mask）</text>
<text class="s" x="260" y="464" style="fill:#FBBF24">仍超 80%：压缩（ctx.compact）</text>

<!-- 继续分支 -->
<path d="M440 402 V428 H660" fill="none" stroke="#22D3EE" stroke-width="1.4"/>
<text class="s" x="680" y="444">降级后继续</text>

<!-- 4 主循环 -->
<rect x="120" y="470" width="640" height="108" rx="12" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.6"/>
<text class="k" x="140" y="496" style="fill:#22D3EE">④ 主循环 runTurn：两条轨道汇合</text>

<rect class="box" x="140" y="508" width="280" height="58" rx="8"/>
<text class="k" x="156" y="530">左轨 · 事件投影</text>
<text class="s" x="156" y="548">buildContext：事件 → 消息</text>
<text class="s" x="156" y="564">只进 10 类事件</text>

<rect class="box" x="460" y="508" width="280" height="58" rx="8"/>
<text class="k" x="476" y="530">右轨 · 提示词层</text>
<text class="s" x="476" y="548">prompt()：分层提示词（含 Soul）</text>
<text class="s" x="476" y="564">每轮现拼，不进事件流</text>

<!-- 汇合到 5 -->
<path class="ln" d="M280 566 V596" marker-end="url(#ac)"/>
<path class="ln" d="M600 566 V596" marker-end="url(#ac)"/>
<text class="k" x="440" y="590" text-anchor="middle" style="fill:#22D3EE">withPrompt 汇合</text>

<!-- 5 生成与工具 -->
<rect class="box" x="120" y="600" width="640" height="30" rx="8"/>
<text class="s" x="136" y="620">⑤ 生成：流式 model.delta 逐条落盘；要工具先权限再执行，tool.result 回灌再来一轮</text>
</svg>
