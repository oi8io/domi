<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="t d">
<title id="t">记忆分层 L0–L4</title>
<desc id="d">L0 工作记忆、L1 会话摘要、L2 情节、L3 语义、L4 Soul。写入先落 _memory 会话事件，semantic_items 与 soul.md 是投影。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .l0{fill:#0F1E26;stroke:#22D3EE;stroke-width:1.4}
  .l1{fill:#0F1E26;stroke:#22D3EE;stroke-width:1.4}
  .l2{fill:#0F1E26;stroke:#A78BFA;stroke-width:1.4}
  .l3{fill:#0F1E26;stroke:#A78BFA;stroke-width:1.4}
  .l4{fill:#0C2016;stroke:#4ADE80;stroke-width:1.8}
  .truth{fill:#17141E;stroke:#F87171;stroke-width:1.3}
</style>
<rect width="880" height="540" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">记忆分层：L0 工作 → L4 Soul</text>
<text class="s" x="20" y="56">写入先落 _memory 会话事件；表是投影，事件是真相</text>

<!-- 层竖排 -->
<rect class="l0" x="60" y="84" width="420" height="52" rx="10"/>
<text class="mono" x="76" y="106">L0</text><text class="k" x="110" y="106">工作记忆</text>
<text class="s" x="200" y="106">当前上下文窗口 · 易失</text>
<text class="s" x="200" y="124">本轮用完就丢</text>

<rect class="l1" x="60" y="146" width="420" height="52" rx="10"/>
<text class="mono" x="76" y="168">L1</text><text class="k" x="110" y="168">会话摘要</text>
<text class="s" x="200" y="168">ctx.compact 结构化摘要 · 随会话</text>
<text class="s" x="200" y="186">压缩时产生</text>

<rect class="l2" x="60" y="208" width="420" height="52" rx="10"/>
<text class="mono" x="76" y="230">L2</text><text class="k" x="110" y="230">情节记忆</text>
<text class="s" x="200" y="230">可检索的历史事件片段 · 跨会话</text>
<text class="s" x="200" y="248">FTS + 向量双路（episodic）</text>

<rect class="l3" x="60" y="270" width="420" height="52" rx="10"/>
<text class="mono" x="76" y="292">L3</text><text class="k" x="110" y="292">语义记忆</text>
<text class="s" x="200" y="292">抽取的事实 / 偏好 / 实体 · 跨会话</text>
<text class="s" x="200" y="310">memory.write 事件是真相</text>

<rect class="l4" x="60" y="332" width="420" height="64" rx="10"/>
<text class="mono" x="76" y="356" style="fill:#4ADE80">L4</text><text class="k" x="110" y="356" style="fill:#4ADE80">Soul</text>
<text class="s" x="200" y="356">稳定人格层 · 长期</text>
<text class="s" x="200" y="374" style="fill:#4ADE80">人类可读 Markdown · 可 diff · 可否决</text>
<text class="s" x="200" y="388">六个固定区 + 来源注释</text>

<!-- 真相侧 -->
<rect class="truth" x="540" y="84" width="300" height="160" rx="12"/>
<text class="k" x="556" y="108" style="fill:#F87171">真相（事件流）</text>
<text class="mono" x="556" y="132">_memory 会话</text>
<text class="s" x="556" y="150">下划线开头，不出现在会话列表</text>
<text class="s" x="556" y="174">memory.write{layer:'L3'}</text>
<text class="s" x="556" y="192">是 L3 语义记忆的真相</text>
<text class="s" x="556" y="216">L4 事件算出 ownedLines</text>
<text class="s" x="556" y="234">（soul 目录里不存在）</text>
<path d="M480 296 H528" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="s" x="420" y="280">抽取写入</text>

<!-- 投影侧 -->
<rect class="box" x="540" y="268" width="300" height="128" rx="12"/>
<text class="k" x="556" y="292" style="fill:#22D3EE">投影（可重建）</text>
<text class="s" x="556" y="316">semantic_items 表</text>
<text class="s" x="556" y="334">append 同事务投影</text>
<text class="s" x="556" y="352">embedding 是唯一非事件列</text>
<text class="s" x="556" y="370">丢了重放重建</text>
<text class="s" x="556" y="388" style="fill:#8FA1B2">soul.md 也是投影：</text>
<text class="s" x="556" y="404" style="fill:#8FA1B2">从 L4 事件渲染</text>

<rect class="box" x="540" y="420" width="300" height="64" rx="10"/>
<text class="k" x="556" y="444" style="fill:#FBBF24">写入纪律</text>
<text class="s" x="556" y="464">MemoryService 一个 daemon 一个实例</text>
<text class="s" x="556" y="478">写操作串行，不互相覆盖</text>

<text class="s" x="20" y="522">贯穿例子：你纠正 domi「限流时别动数据库表结构」——先落 L3 事件 → 审阅 → 蒸馏进 Soul 的「技术偏好」区</text>
</svg>
