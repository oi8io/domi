<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-labelledby="t d">
<title id="t">一轮对话的时序</title>
<desc id="d">客户端提交后，domi 会话定格并预检，kernel 循环把事件投影与提示词层汇合后调用模型，流式结果与工具结果逐条落盘，直到终止条件触发。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .h{font-size:14px;font-weight:700}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.3;fill:none}
</style>
<rect width="880" height="760" rx="14" fill="#0D141B"/>

<!-- 泳道头 -->
<rect class="box" x="16" y="24" width="116" height="52" rx="8"/>
<text class="h" x="74" y="48" text-anchor="middle">客户端</text>
<text class="s" x="74" y="64" text-anchor="middle">TUI / Web</text>
<rect class="box" x="148" y="24" width="150" height="52" rx="8"/>
<text class="h" x="223" y="48" text-anchor="middle">domi 会话</text>
<text class="s" x="223" y="64" text-anchor="middle">runtime/session.ts</text>
<rect class="box" x="314" y="24" width="150" height="52" rx="8"/>
<text class="h" x="389" y="48" text-anchor="middle">kernel 循环</text>
<text class="s" x="389" y="64" text-anchor="middle">runTurn</text>
<rect class="box" x="480" y="24" width="132" height="52" rx="8"/>
<text class="h" x="546" y="48" text-anchor="middle">模型</text>
<text class="s" x="546" y="64" text-anchor="middle">provider</text>
<rect class="box" x="628" y="24" width="120" height="52" rx="8"/>
<text class="h" x="688" y="48" text-anchor="middle">工具</text>
<text class="s" x="688" y="64" text-anchor="middle">tool.run</text>
<rect class="box" x="764" y="24" width="100" height="52" rx="8"/>
<text class="h" x="814" y="48" text-anchor="middle">事件流</text>
<text class="s" x="814" y="64" text-anchor="middle">append-only</text>

<!-- 泳道竖线 -->
<line x1="74" y1="92" x2="74" y2="720" stroke="#1B2836" stroke-width="1"/>
<line x1="223" y1="92" x2="223" y2="720" stroke="#1B2836" stroke-width="1"/>
<line x1="389" y1="92" x2="389" y2="720" stroke="#1B2836" stroke-width="1"/>
<line x1="546" y1="92" x2="546" y2="720" stroke="#1B2836" stroke-width="1"/>
<line x1="688" y1="92" x2="688" y2="720" stroke="#1B2836" stroke-width="1"/>
<line x1="814" y1="92" x2="814" y2="720" stroke="#1B2836" stroke-width="1"/>

<!-- 1 提交 -->
<path d="M74 116 H210" fill="none" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#ac)"/>
<text class="k" x="84" y="108" style="fill:#22D3EE">submit{text}</text>
<path d="M223 134 H800" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="mono" x="233" y="152">user.input 落盘（同一批：引用 / 附件 / noteIds）</text>

<!-- 2 定格 -->
<rect class="box" x="150" y="168" width="146" height="58" rx="8"/>
<text class="k" x="162" y="190">定格 freeze</text>
<text class="s" x="162" y="206">soul / 规矩 / 技能</text>
<text class="s" x="162" y="220">计划 / 环境，只读一次</text>

<!-- 3 预检 -->
<rect class="box" x="150" y="242" width="146" height="58" rx="8"/>
<text class="k" x="162" y="264">预检降级链</text>
<text class="s" x="162" y="280">遮蔽 → 压缩 → 硬顶</text>
<text class="s" x="162" y="294">不够就停下</text>

<!-- 4 runTurn -->
<path d="M223 300 V326 H376" fill="none" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#ac)"/>
<text class="k" x="250" y="320" style="fill:#22D3EE">runTurn(deps, id, input)</text>

<!-- 循环读事件 -->
<path d="M389 344 V356 H800" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="mono" x="400" y="374">读事件（安全点：先取运行中补充 notes）</text>

<!-- 左轨 -->
<rect class="box" x="316" y="392" width="146" height="62" rx="8"/>
<text class="k" x="328" y="414">左轨 buildContext</text>
<text class="s" x="328" y="430">事件 → 模型消息</text>
<text class="s" x="328" y="444">只进 10 类事件</text>

<!-- 右轨 -->
<rect class="box" x="480" y="392" width="132" height="62" rx="8"/>
<text class="k" x="492" y="414">右轨 prompt()</text>
<text class="s" x="492" y="430">层拼装（含 Soul）</text>
<text class="s" x="492" y="444">每轮现拼</text>
<path d="M546 454 V466 H400" fill="none" stroke="#A78BFA" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text class="s" x="452" y="464" style="fill:#A78BFA">取提示词</text>

<!-- 汇合 -->
<text class="k" x="320" y="500" style="fill:#22D3EE">withPrompt 汇合：</text>
<text class="s" x="320" y="518">notes 追加 user 块 → system 置顶 → 稳定 user 块插位</text>

<!-- 生成 -->
<path d="M389 528 V540 H532" fill="none" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#ac)"/>
<text class="k" x="400" y="536" style="fill:#22D3EE">generate(messages)</text>
<path d="M546 558 V580 H402" fill="none" stroke="#4ADE80" stroke-width="1.3" marker-end="url(#ag)"/>
<text class="mono" x="410" y="576">delta / reason / tool-call 流式返回</text>
<path d="M389 598 V610 H800" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="mono" x="400" y="628">model.delta 逐条落盘 → model.request 带 ctx 分段与 fingerprint</text>

<!-- 工具 -->
<path d="M389 646 V658 H674" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="k" x="400" y="654">tool-call（先权限，默认拒绝）</text>
<path d="M688 676 V688 H402" fill="none" stroke="#4ADE80" stroke-width="1.3" marker-end="url(#ag)"/>
<text class="mono" x="410" y="684">tool.result 回灌 → 落盘 → 再来一轮</text>

<!-- 收场 -->
<path d="M389 706 V712 H223" fill="none" stroke="#F87171" stroke-width="1.4" marker-end="url(#a)"/>
<text class="k" x="240" y="720" style="fill:#F87171">任一终止条件触发 → error{stopReason}，轮结束</text>
</svg>
