<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 656" width="880" height="656" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">路线 A：第 2 步失败时怎么办</title>
<desc id="d">失败结果交回模型，模型修复、换办法或问你；上限触发则本轮停下，计划保留，你点继续后从第 2 步接着做。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .h{font-size:15px;font-weight:700}
  .s{font-size:12px;fill:#8FA1B2}
  .t{font-size:12.5px}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11.5px;fill:#8FA1B2}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.4;fill:none}
</style>
<rect width="880" height="656" rx="14" fill="#0D141B"/>
<text class="k" x="20" y="30" style="fill:#22D3EE">路线 A：计划在本会话里执行，第 ② 步做到一半，类型检查报错</text>
<rect x="20" y="44" width="200" height="58" rx="10" fill="#0F1A14" stroke="#4ADE80" stroke-width="1.4"/>
<text class="k" x="34" y="68">① 读现有登录代码</text>
<text class="s" x="34" y="90" style="fill:#4ADE80">✓ 完成</text>
<rect x="233" y="44" width="200" height="58" rx="10" fill="#221316" stroke="#F87171" stroke-width="1.4"/>
<text class="k" x="247" y="68">② 写限流中间件</text>
<text class="s" x="247" y="90" style="fill:#F87171">进行中</text>
<rect class="box" x="446" y="44" width="200" height="58" rx="10"/>
<text class="k" x="460" y="68">③ 补测试</text>
<text class="s" x="460" y="90">待做</text>
<rect class="box" x="659" y="44" width="200" height="58" rx="10"/>
<text class="k" x="673" y="68">④ 跑全量测试</text>
<text class="s" x="673" y="90">待做</text>
<rect x="300" y="78" width="104" height="18" rx="4" fill="#3A1418"/>
<text class="s" x="352" y="91" text-anchor="middle" style="fill:#F87171">tsc 报错 · exit 1</text>
<path d="M326 102 V132" fill="none" stroke="#F87171" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="170" y="134" width="312" height="52" rx="10" fill="#221316" stroke="#F87171" stroke-width="1.4"/>
<text class="k" x="326" y="156" text-anchor="middle" style="fill:#F87171">失败的结果交回模型</text>
<text class="s" x="326" y="176" text-anchor="middle">报错只是一条数据，这一轮不会因此停下</text>
<path d="M326 186 V204 H150 V222" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="224" width="260" height="74" rx="10" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.4"/>
<text class="k" x="34" y="248" style="fill:#22D3EE">修好再试</text>
<text class="t" x="34" y="270">读报错，改代码，重新检查</text>
<text class="s" x="34" y="289">最常见的情况</text>
<path d="M326 186 V204 H440 V222" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="310" y="224" width="260" height="74" rx="10" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.4"/>
<text class="k" x="324" y="248" style="fill:#22D3EE">换个办法</text>
<text class="t" x="324" y="270">用 plan.update 改计划</text>
<text class="s" x="324" y="289">需要审批时，改了步骤要你重批</text>
<path d="M326 186 V204 H730 V222" fill="none" stroke="#8FA1B2" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="600" y="224" width="260" height="74" rx="10" fill="#0F1E26" stroke="#22D3EE" stroke-width="1.4"/>
<text class="k" x="614" y="248" style="fill:#22D3EE">问你</text>
<text class="t" x="614" y="270">用 ask.user 一次问清</text>
<text class="s" x="614" y="289">等你选，选完接着做</text>
<text class="t" x="20" y="324" style="fill:#4ADE80">做通以后：② 标为完成，③ 标为进行中。同一时间只有一步是「进行中」。</text>
<rect class="box" x="20" y="340" width="840" height="136" rx="10"/>
<text class="k" x="36" y="364" style="fill:#FBBF24">兜底：下面任何一条触发，这一轮就停（不会无限试下去）</text>
<rect x="36" y="376" width="264" height="32" rx="7" fill="#1A1A10" stroke="#3B3416"/>
<text class="t" x="46" y="397">单轮工具调用满 100 次</text>
<rect x="312" y="376" width="264" height="32" rx="7" fill="#1A1A10" stroke="#3B3416"/>
<text class="t" x="322" y="397">单轮超过 10 分钟</text>
<rect x="588" y="376" width="264" height="32" rx="7" fill="#1A1A10" stroke="#3B3416"/>
<text class="t" x="598" y="397">参数连续 3 次解析失败</text>
<rect x="36" y="416" width="264" height="32" rx="7" fill="#1A1A10" stroke="#3B3416"/>
<text class="t" x="46" y="437">用量到顶，你选「停」</text>
<rect x="312" y="416" width="264" height="32" rx="7" fill="#1A1A10" stroke="#3B3416"/>
<text class="t" x="322" y="437">模型接口重试 3 次仍失败</text>
<rect x="588" y="416" width="264" height="32" rx="7" fill="#1A1A10" stroke="#3B3416"/>
<text class="t" x="598" y="437">你点「停止」或按 Esc</text>
<text class="s" x="36" y="464">另外：改了文件、却没有跑通验证就想收工时，domi 追加提示让模型去验证，最多 2 次，之后如实结束。</text>
<text class="k" x="20" y="504" style="fill:#A78BFA">停下以后</text>
<rect x="20" y="516" width="250" height="70" rx="10" fill="#17142A" stroke="#A78BFA" stroke-width="1.4"/>
<text class="k" x="34" y="540">计划留在会话记录里</text>
<text class="s" x="34" y="560">② 仍是「进行中」</text>
<text class="s" x="34" y="576">已经写好的代码和输出都保留</text>
<path d="M270 551 H296" fill="none" stroke="#A78BFA" stroke-width="1.4" marker-end="url(#av)"/>
<rect x="298" y="516" width="270" height="70" rx="10" fill="#17142A" stroke="#A78BFA" stroke-width="1.4"/>
<text class="k" x="312" y="540">界面提示</text>
<rect x="312" y="550" width="244" height="26" rx="6" fill="#0D141B" stroke="#2A3B4D"/>
<text class="s" x="322" y="568">上次被打断了 · 计划还剩 3/4 步</text>
<rect x="512" y="553" width="38" height="20" rx="5" fill="#A78BFA"/>
<text class="s" x="531" y="567" text-anchor="middle" style="fill:#0D141B;font-weight:700">继续</text>
<path d="M568 551 H594" fill="none" stroke="#A78BFA" stroke-width="1.4" marker-end="url(#av)"/>
<rect x="596" y="516" width="264" height="70" rx="10" fill="#17142A" stroke="#A78BFA" stroke-width="1.4"/>
<text class="k" x="610" y="540">你点「继续」</text>
<text class="s" x="610" y="560">等于替你说一句「接着做」</text>
<text class="s" x="610" y="576">模型先查现状，再从 ② 接着做</text>
<text class="s" x="20" y="616">不会自动续跑：要不要接着做，由你决定。不想要这些改动，可以回到某一步之前：只回滚文件、只回滚对话，或两者都回滚。</text>
<text class="s" x="20" y="638">进程被强制杀掉也一样：重启后 domi 只补齐记录（把没结果的工具调用标成「被中断」），不替你重跑。</text>
</svg>
