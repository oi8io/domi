<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="t d">
<title id="t">轨迹与回放一体两面</title>
<desc id="d">同一份事件流两个消费方向：向上渲染成轨迹（六类标签、按轮分组），向下回放成测试（真实 kernel + 录制 SSE 流，无网进 CI）。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .st{fill:#0F1E26;stroke:#22D3EE;stroke-width:1.4}
  .warn{fill:#17142A;stroke:#FBBF24;stroke-width:1.4}
  .ok{fill:#0C2016;stroke:#4ADE80;stroke-width:1.4}
  .bad{fill:#17141E;stroke:#F87171;stroke-width:1.4}
</style>
<rect width="880" height="460" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">轨迹与评估是一体两面（INV-13）</text>
<text class="s" x="20" y="56">轨迹是事件流的渲染，回放是事件流的第二次消费</text>

<!-- 事件流 -->
<rect class="warn" x="340" y="90" width="200" height="130" rx="12"/>
<text class="k" x="356" y="114" style="fill:#FBBF24">事件流</text>
<text class="s" x="356" y="136">model.reason · tool.call</text>
<text class="s" x="356" y="154">tool.result · permission · error</text>
<text class="s" x="356" y="172">M0 就埋 · 后补代价极大</text>
<text class="s" x="356" y="190">不新增埋点（INV-13）</text>

<path d="M340 155 H290" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M540 155 H590" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="s" x="296" y="142">渲染</text>
<text class="s" x="598" y="142">回放</text>

<!-- 轨迹 -->
<rect class="st" x="60" y="90" width="220" height="200" rx="12"/>
<text class="k" x="76" y="114">轨迹（packages/trace）</text>
<text class="s" x="76" y="136">按轮分组 · 打标签 · 给序号</text>
<text class="s" x="76" y="156">六类标签：</text>
<text class="s" x="76" y="174">用户 / 模型 / 工具 / 权限 / 上下文 / 错误</text>
<text class="s" x="76" y="196">text.ts → domi trace &lt;id&gt;</text>
<text class="s" x="76" y="214">html.ts → --html 可交互</text>
<text class="s" x="76" y="232">model.ts → 节点模型</text>
<text class="s" x="76" y="250">Web 轨迹页同源：过滤 / 搜索 / 时间线</text>
<text class="s" x="76" y="268">paginateByTurns 超长切页</text>

<!-- 回放 -->
<rect class="ok" x="600" y="90" width="220" height="200" rx="12"/>
<text class="k" x="616" y="114" style="fill:#4ADE80">回放 L1（packages/eval）</text>
<text class="s" x="616" y="136">回放模型与工具</text>
<text class="s" x="616" y="154">跑的是真的 kernel</text>
<text class="s" x="616" y="172">只有「模型推理」被固定</text>
<text class="s" x="616" y="190">不花钱 · 不联网 · 进 CI</text>
<text class="s" x="616" y="208">判据：工具序列 + 事件流等价</text>
<text class="s" x="616" y="226">Divergence{index, expected, actual, seq}</text>
<text class="s" x="616" y="244">seq 跳到轨迹对应节点</text>
<text class="s" x="616" y="262">fixture = 原始 SSE 流</text>

<!-- 底部 -->
<rect class="bad" x="60" y="320" width="760" height="86" rx="10"/>
<text class="k" x="76" y="344" style="fill:#F87171">轨迹数据组织</text>
<text class="s" x="76" y="366">fixtures/events/legacy-v*.jsonl —— 每次 SCHEMA_VERSION 升版补一份，旧事件永远可解析（INV-01）</text>
<text class="s" x="76" y="384">ctx.ref（跨会话引用）· parent_seq（分支）· paginateByTurns（超长切页）</text>
<text class="s" x="76" y="402">录制：domi eval record &lt;sessionId&gt; —— 数据来源只有事件流</text>

<text class="s" x="20" y="440">真实会话 = 测试 fixture · fixtures/sessions/ 跟着代码进版本库，是测试资产不是用户数据</text>
</svg>
