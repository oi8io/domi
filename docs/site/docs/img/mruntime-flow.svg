<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-labelledby="t d">
<title id="t">模型层归约</title>
<desc id="d">kernel 只认识 ModelProvider 一个接口；适配层把各厂商的流翻译成五种 ModelEvent；usage 原样透传；能力未声明在发请求前抛错。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .box{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
  .st{fill:#0F1E26;stroke:#22D3EE;stroke-width:1.4}
  .warn{fill:#17142A;stroke:#FBBF24;stroke-width:1.4}
</style>
<rect width="880" height="480" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">所有厂商归约成同一个 ModelProvider</text>
<text class="s" x="20" y="56">kernel 不 import 任何 provider SDK（INV-02），只 import 这里的类型</text>

<!-- kernel -->
<rect class="st" x="60" y="90" width="200" height="120" rx="12"/>
<text class="k" x="76" y="114">kernel / runtime</text>
<text class="s" x="76" y="136">generate(req, signal)</text>
<text class="s" x="76" y="154">AsyncIterable&lt;ModelEvent&gt;</text>
<text class="s" x="76" y="172">不 import SDK</text>
<text class="s" x="76" y="190">零 IO 边界</text>
<path d="M260 150 H310" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="s" x="272" y="140">请求</text>

<!-- 接口层 -->
<rect class="warn" x="320" y="90" width="200" height="120" rx="12"/>
<text class="k" x="336" y="114" style="fill:#FBBF24">ModelProvider</text>
<text class="s" x="336" y="136">id · capabilities · generate</text>
<text class="s" x="336" y="154">能力矩阵静态声明</text>
<text class="s" x="336" y="172">未声明 → 发请求前抛错</text>
<text class="s" x="336" y="190">不靠运行时碰运气</text>
<path d="M520 150 H560" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>

<!-- 适配 -->
<rect class="st" x="570" y="90" width="250" height="120" rx="12"/>
<text class="k" x="586" y="114">AI SDK 适配层</text>
<text class="s" x="586" y="136">把厂商流翻译成 ModelEvent</text>
<text class="s" x="586" y="154">createOpenAI / createAnthropic</text>
<text class="s" x="586" y="172">createOpenAICompatible</text>
<text class="s" x="586" y="190">usage 原样透传</text>

<!-- 事件 -->
<rect class="box" x="60" y="250" width="760" height="130" rx="12"/>
<text class="k" x="76" y="274">ModelEvent 只有五种</text>
<rect class="box" x="76" y="288" width="140" height="46" rx="8"/><text class="mono" x="92" y="310">delta</text><text class="s" x="92" y="326">输出文本</text>
<rect class="box" x="228" y="288" width="140" height="46" rx="8"/><text class="mono" x="244" y="310">reason</text><text class="s" x="244" y="326">思维链</text>
<rect class="box" x="380" y="288" width="140" height="46" rx="8"/><text class="mono" x="396" y="310">tool-call</text><text class="s" x="396" y="326">请求工具</text>
<rect class="box" x="532" y="288" width="140" height="46" rx="8"/><text class="mono" x="548" y="310">usage</text><text class="s" x="548" y="326">原始字段</text>
<rect class="box" x="684" y="288" width="120" height="46" rx="8"/><text class="mono" x="700" y="310">error</text><text class="s" x="700" y="326">带 recoverable</text>
<text class="s" x="76" y="364" style="fill:#8FA1B2">usage 原样透传：缓存命中率（状态栏）与压缩判断都靠这份原始字段——丢了就没有输入（ADR-004）</text>

<text class="s" x="20" y="430">factory.ts 是唯一知道「有哪些 provider」的地方：新增厂商 = 实现接口 + 注册，kernel 与 model/core 的 diff 为 0</text>
<text class="s" x="20" y="452">厂商模板在 config/src/vendors.ts：openai / anthropic / deepseek / gemini / custom——纯数据（协议 · 地址 · 能力 · 适配器）</text>
</svg>
