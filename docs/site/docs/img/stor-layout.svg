<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="t d">
<title id="t">存储布局</title>
<desc id="d">真相只有 events 表；sessions 记元数据；FTS、语义、进度、已读、项目、日程都是同事务投影、可删重建；迁移与脱敏保护旧库与凭据。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .truth{fill:#0C2016;stroke:#4ADE80;stroke-width:1.6}
  .proj{fill:#0F1E26;stroke:#22D3EE;stroke-width:1.3}
  .side{fill:#111A23;stroke:#2A3B4D;stroke-width:1.2}
</style>
<rect width="880" height="460" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">磁盘上只有事件流，其余全是投影</text>
<text class="s" x="20" y="56">~/.domi/events.db · daemon 是唯一写入者</text>

<!-- 真相区 -->
<rect class="truth" x="40" y="84" width="360" height="180" rx="12"/>
<text class="k" x="56" y="110" style="fill:#4ADE80">真相（不可重建）</text>
<rect class="side" x="60" y="122" width="320" height="52" rx="8"/>
<text class="mono" x="76" y="142">events (session_id, seq)</text>
<text class="s" x="76" y="158">type · payload · ts · schema_version</text>
<text class="s" x="76" y="172">主键 (session_id, seq)</text>
<rect class="side" x="60" y="182" width="320" height="52" rx="8"/>
<text class="mono" x="76" y="202">sessions</text>
<text class="s" x="76" y="218">id · created_at · cwd · kind · project_id</text>
<text class="s" x="76" y="232">分支只记 parent_seq 指针</text>
<text class="s" x="56" y="252" style="fill:#4ADE80">追加写入：一次事务，要么全成要么全回滚</text>

<!-- 箭头 -->
<path d="M400 174 H436" fill="none" stroke="#8FA1B2" stroke-width="1.3" marker-end="url(#a)"/>
<text class="s" x="404" y="152">同事务投影</text>

<!-- 投影区 -->
<rect class="proj" x="440" y="84" width="400" height="180" rx="12"/>
<text class="k" x="456" y="110" style="fill:#22D3EE">投影（可删掉重建）</text>
<text class="s" x="456" y="132">events_fts（FTS5 trigram，3 字符起）</text>
<text class="s" x="456" y="152">semantic_items（L3 记忆，embedding 缓存）</text>
<text class="s" x="456" y="172">memory_progress · fts_progress</text>
<text class="s" x="456" y="192">read_marks · projects · schedules</text>
<text class="s" x="456" y="212">schedule_runs</text>
<text class="s" x="456" y="238" style="fill:#8FA1B2">丢了重放事件流就回来；embedding 列重算</text>

<!-- 底部两个 -->
<rect class="side" x="40" y="292" width="400" height="120" rx="10"/>
<text class="k" x="56" y="316" style="fill:#FBBF24">迁移：只加不改</text>
<text class="s" x="56" y="338">MIGRATIONS 3 条（v3 / v8 / v11）</text>
<text class="s" x="56" y="354">加列 / 加表 / 加索引；不改旧行含义</text>
<text class="s" x="56" y="370">guard:migrations 查幂等与只加</text>
<text class="s" x="56" y="386">migrate-m15 独立脚本：内部会话泄漏迁移</text>
<text class="s" x="56" y="402">（先备份 backups/pre-m15-*/，幂等，保留 seq）</text>

<rect class="side" x="440" y="292" width="400" height="120" rx="10"/>
<text class="k" x="456" y="316" style="fill:#FBBF24">脱敏与保护</text>
<text class="s" x="456" y="338">serializeRedacted 落盘前替换凭据</text>
<text class="s" x="456" y="354">~/.domi/secrets.yaml 里的凭据不进事件</text>
<text class="s" x="456" y="370">界面 / 导出 / 轨迹不回吐凭据</text>
<text class="s" x="456" y="386">guard:secrets 扫 fixtures 与 docs</text>
<text class="s" x="456" y="402">readOnlyFuture：版本高于代码 → 只读打开告警</text>

<text class="s" x="20" y="440">压缩不删事件只追加 ctx.compact；分支不复制事件只记父指针——这些都是「只有事件流」的推论</text>
</svg>
