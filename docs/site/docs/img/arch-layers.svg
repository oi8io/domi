<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-labelledby="t d">
<title id="t">分层架构</title>
<desc id="d">视图层、daemon、runtime、kernel 四层，能力包从旁注入。三条硬边界：kernel 零 IO、三端零业务逻辑、daemon 唯一写入者。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1B2"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
</defs>
<style>
  text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;fill:#E8EEF4}
  .s{font-size:11.5px;fill:#8FA1B2}
  .k{font-size:12.5px;font-weight:700}
  .mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#9BE8F5}
  .lv{fill:#111A23;stroke:#22D3EE;stroke-width:1.6}
  .dm{fill:#111A23;stroke:#FBBF24;stroke-width:1.6}
  .rt{fill:#111A23;stroke:#A78BFA;stroke-width:1.6}
  .kr{fill:#111A23;stroke:#4ADE80;stroke-width:1.6}
  .side{fill:#0F1E26;stroke:#2A3B4D;stroke-width:1.2}
  .ln{stroke:#8FA1B2;stroke-width:1.3;fill:none}
</style>
<rect width="880" height="600" rx="14" fill="#0D141B"/>

<text class="k" x="20" y="36" style="fill:#22D3EE">domi 分层：视图 → daemon → runtime → kernel</text>
<text class="s" x="20" y="56">依赖方向单向：protocol ← kernel ← runtime ← daemon ← apps；能力包从旁注入</text>

<!-- 视图层 -->
<rect class="lv" x="160" y="82" width="560" height="58" rx="12"/>
<text class="k" x="176" y="108">视图层</text>
<text class="s" x="176" y="128">TUI（Ink）· Web（React）· Desktop（Tauri）</text>
<text class="s" x="470" y="128" style="fill:#22D3EE">零业务逻辑（硬边界 2）</text>

<!-- 协议箭头 -->
<path d="M440 140 V168" fill="none" class="ln" marker-end="url(#ac)"/>
<text class="mono" x="452" y="160">Domi Protocol · JSON-RPC 2.0 · stdio / WebSocket</text>

<!-- daemon -->
<rect class="dm" x="160" y="172" width="560" height="74" rx="12"/>
<text class="k" x="176" y="196" style="fill:#FBBF24">daemon（domid）</text>
<text class="s" x="176" y="218">core.ts 分发 · runtime-host · scheduler/cron · transport-ws</text>
<text class="s" x="176" y="236">事件流唯一写入者（硬边界 3）</text>

<path d="M440 246 V274" fill="none" class="ln" marker-end="url(#a)"/>

<!-- runtime -->
<rect class="rt" x="160" y="278" width="560" height="66" rx="12"/>
<text class="k" x="176" y="302" style="fill:#A78BFA">runtime（门面）</text>
<text class="s" x="176" y="324">DomiSession = kernel + store + 能力 + 记忆的装配点</text>
<text class="s" x="176" y="340">子 agent · 计划 · 提问 · 评审 · 工作树 · 项目 · 记忆服务</text>

<path d="M440 344 V372" fill="none" class="ln" marker-end="url(#a)"/>

<!-- kernel -->
<rect class="kr" x="160" y="376" width="560" height="74" rx="12"/>
<text class="k" x="176" y="400" style="fill:#4ADE80">kernel（纯函数，零 IO——硬边界 1）</text>
<text class="s" x="176" y="422">loop · buildContext · 终止条件 · 恢复</text>
<text class="s" x="176" y="440">package.json 里除 @domi/protocol 一无所有</text>

<!-- 旁注包 -->
<rect class="side" x="60" y="470" width="240" height="110" rx="10"/>
<text class="k" x="76" y="494">注入能力</text>
<text class="s" x="76" y="516">capability（工具 / 权限）</text>
<text class="s" x="76" y="532">store（SQLite 事件流）</text>
<text class="s" x="76" y="548">memory · model · prompt</text>
<text class="s" x="76" y="564">mcp · plugin · orchestrator</text>

<rect class="side" x="360" y="470" width="240" height="110" rx="10"/>
<text class="k" x="376" y="494">数据</text>
<text class="s" x="376" y="516">事件流（append-only）</text>
<text class="s" x="376" y="532">FTS5 / 语义表是投影</text>
<text class="s" x="376" y="548">checkpoint（影子 git）</text>
<text class="s" x="376" y="564">trace · observability</text>

<rect class="side" x="660" y="470" width="200" height="110" rx="10"/>
<text class="k" x="676" y="494">守卫（guard:*）</text>
<text class="s" x="676" y="516">dep：依赖方向</text>
<text class="s" x="676" y="532">providers：SDK 位置</text>
<text class="s" x="676" y="548">migrations：迁移规则</text>
<text class="s" x="676" y="564">api / protocol / append-only</text>

<text class="s" x="20" y="588">SDK 包名只出现在 model/src/factory.ts；厂商知识只在 config/src/vendors.ts（guard:providers 扫全仓）</text>
</svg>
