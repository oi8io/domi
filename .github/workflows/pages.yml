# 宣传主站 + 文档站 → GitHub Pages
#
# 这是 oi8io/domi 的「项目站」。账号的用户站（oi8io.github.io）配了自定义域名
# oi8io.cn 时，项目站会自动出现在 https://oi8io.cn/domi/，本仓库不需要 CNAME。
# 首次使用：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/site/**'
      - 'scripts/build-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
