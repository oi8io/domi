# CI —— 三道防线的执行处。见 docs/ENGINEERING.md / docs/spec/M0.md §5
#
# INV-08：真实 LLM 调用不进 CI 门禁。
# 本 workflow 不注入任何模型凭据——测试全部对 ModelProvider 打桩。
# 需要真实调用的验收走 nightly，见 docs/PRD.md §0.4。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # INV-05 等编译期不变量
      - name: typecheck
        run: pnpm typecheck

      # INV-02 架构边界 / INV-10 任务反查 PRD / INV-01 append-only 与契约快照
      - name: 架构守卫
        run: pnpm guard

      - name: 测试
        run: pnpm test

      # PRD-M2-008：L1 回放。不联网、不花钱，所以可以进门禁（INV-08 / INV-13）
      - name: L1 轨迹回放
        run: pnpm eval

      # PRD-M1-008 AC-1/2/3/4 · INV-07：产物在没有 Node 的干净环境里跑得起来
      - name: 单二进制冒烟（当前平台）
        run: pnpm smoke

  # AC-2 点名四个平台。跟 check 并行跑——它只验构建产得出来，不需要等测试
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 构建四平台产物
        run: pnpm build:all

      - uses: actions/upload-artifact@v4
        with:
          name: domi-binaries
          path: dist/domi-*
          retention-days: 14
